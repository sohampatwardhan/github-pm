name: Bug
description: Report something that used to work or does not match the documented behavior.
title: "[Bug]: "
labels: ["type:bug", "needs-triage"]
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to write this up. Search existing issues first.
  - type: checkboxes
    id: existing
    attributes:
      label: Existing issues
      description: Please search open and closed issues before filing.
      options:
        - label: I searched existing issues and did not find this bug.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What broke, in one or two sentences?
      placeholder: Checkout retries a 503 and the card is charged twice.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps a maintainer can follow.
      placeholder: |
        1. Call POST /checkout with an idempotency key.
        2. Force the charge endpoint to return 503.
        3. See a second charge.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.3.2
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime, and any relevant config.
      value: |
        - OS:
        - Runtime:
        - Config:
      render: markdown
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs. They will be formatted as a code block.
      render: shell
    validations:
      required: false
  - type: upload
    id: attachments
    attributes:
      label: Screenshots or traces
      description: Optional. Images, short videos, or a text log.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.webm,.log,.txt"
