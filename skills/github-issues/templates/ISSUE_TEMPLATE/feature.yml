name: Feature
description: Propose a new capability, including the problem it solves.
title: "[Feature]: "
labels: ["type:feature", "needs-triage"]
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution. A feature without a user is hard to prioritize.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is blocked, and what can they not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behavior you want, from the caller's point of view.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What else did you consider?
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist of observable outcomes.
      value: |
        - [ ]
    validations:
      required: true
